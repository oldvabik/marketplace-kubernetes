apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-payment
  namespace: marketplace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-payment
  template:
    metadata:
      labels:
        app: mongodb-payment
    spec:
      containers:
        - name: mongodb-payment
          image: mongo:7.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: payment_db
          volumeMounts:
            - name: mongodb-payment-storage
              mountPath: /data/db
      volumes:
        - name: mongodb-payment-storage
          persistentVolumeClaim:
            claimName: mongodb-payment-pvc
